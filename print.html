<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COTS Check-In — Print Sheet</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 32px 40px 24px;
    border: 2px solid #e2dff5;
    border-radius: 20px;
    max-width: 420px;
    width: 100%;
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: #1a1a2e;
    text-align: center;
    text-transform: uppercase;
  }

  #qr { width: 280px; height: 280px; }

  .url {
    font-size: 0.85rem;
    color: #7a7a9a;
    letter-spacing: 0.02em;
  }

  .print-hint {
    font-size: 0.75rem;
    color: #aaa;
    text-align: center;
    margin-top: 4px;
  }

  /* Print styles */
  @media print {
    body {
      min-height: unset;
      padding: 0;
      background: #fff;
    }
    .card {
      border: none;
      padding: 0.5in 0.5in 0.3in;
      max-width: 100%;
      page-break-inside: avoid;
    }
    #qr { width: 3.6in; height: 3.6in; }
    h1 { font-size: 1.1rem; }
    .print-hint { display: none; }
  }
</style>
</head>
<body>
<div class="card">
  <h1>Columbus on the Spectrum</h1>
  <canvas id="qr"></canvas>
  <span class="url">tinyurl.com/cotscheckin</span>
  <p class="print-hint">Ctrl + P &rarr; Save as PDF &nbsp;&middot;&nbsp; or print directly</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
  window.addEventListener('load', function() {
    const qr = qrcode(0, 'H');
    qr.addData('https://tinyurl.com/cotscheckin');
    qr.make();
    const n = qr.getModuleCount();
    const canvas = document.getElementById('qr');
    const size = canvas.offsetWidth || 280;
    canvas.width = size * 2;
    canvas.height = size * 2;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    const ctx = canvas.getContext('2d');
    const mod = (size * 2) / n;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000';
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        if (qr.isDark(r, c)) {
          ctx.fillRect(Math.floor(c * mod), Math.floor(r * mod),
                       Math.ceil(mod), Math.ceil(mod));
        }
      }
    }
  });
</script>
</body>
</html>
